<!DOCTYPE html>
<html>
<head>
    <title>Log in - Expense App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000026;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #555555;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .new-user {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Log In</h1>

        <p class="subtitle">
            Sign in to start managing your expenses
        </p>

        <!-- No action and method here because JavaScript handles login -->
        <form id="loginForm">

            <label for="email">Email</label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Log In
            </button>

        </form>

        <p class="new-user">
            Create an account?
            <a href="/signup">Sign up</a>
        </p>

    </div>


    <script>

        // Get login form
        const loginForm =
            document.getElementById("loginForm");


        // When user submits login form
        loginForm.addEventListener(
            "submit",
            async (event) => {

                // Stop normal form submission
                event.preventDefault();


                // Get email value
                const email =
                    document.getElementById("email").value;


                // Get password value
                const password =
                    document.getElementById("password").value;


                try {

                    // Send login request to backend
                    const response =
                        await fetch("/login", {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        });


                    // Get response from backend
                    const data =
                        await response.json();


                    // If login successful
                    if (response.ok) {

                        // Save JWT token in browser
                        localStorage.setItem(
                            "token",
                            data.token
                        );


                        // Open expense page
                        window.location.href =
                            "/expenses";

                    } else {

                        // Show backend error
                        alert(data.message);
                    }

                } catch (error) {

                    console.log(
                        "Login error:",
                        error
                    );

                    alert(
                        "Something went wrong"
                    );
                }
            }
        );

    </script>

</body>
</html>
