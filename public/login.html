<!DOCTYPE html>
<html>
<head>
    <title>Log in - Expense App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000026;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #555555;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .new-user {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Log In</h1>

        <p class="subtitle">
            Sign in to start managing your expenses
        </p>


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Log In
            </button>

        </form>


        <p class="new-user">
            Create an account?
            <a href="/signup">
                Sign up
            </a>
        </p>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document.getElementById("email").value;


                const password =
                    document.getElementById("password").value;


                try {

                    const response =
                        await fetch(
                            "/api/user/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (response.ok) {

                        localStorage.setItem(
                            "token",
                            data.token
                        );


                        window.location.href =
                            "/expense";

                    } else {

                        alert(
                            data.message ||
                            "Unable to login"
                        );
                    }

                } catch (error) {

                    console.log(
                        "Login error:",
                        error
                    );


                    alert(
                        "Something went wrong. Please try again."
                    );
                }
            }
        );

    </script>

</body>
</html>
