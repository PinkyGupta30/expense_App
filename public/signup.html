<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Expense App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #555555;
        }

       button {
              width: 100%;
              padding: 12px;
              border: none;
              border-radius: 6px;
              background-color: #007bff;
              color: white;
              font-size: 16px;
              font-weight: bold;
              cursor: pointer;
              transition: 0.3s;
             }

button:hover {
    background-color: #0056b3;
    transform: translateY(-1px);
}

button:active {
    transform: translateY(1px);
}
       
    </style>
</head>

<body>

    <div class="container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Sign up to start managing your expenses
        </p>

        <form action="/signup" method="POST">

            <label for="name">Name</label>
            <input
                id="name"
                name="name"
                type="text"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Sign Up</button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="#">Login</a>
        </p>

    </div>

</body>
</html>
