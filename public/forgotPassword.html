<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password - Expense App</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 35px;

            border-radius: 12px;
            box-shadow: 0 5px 20px #00000026;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #cccccc;
            border-radius: 6px;

            margin-bottom: 18px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #555555;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background-color: #007bff;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Forgot Password</h1>

        <p class="subtitle">
            Enter your email address and we will send you
            a password reset email.
        </p>


        <form id="forgotPasswordForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Send Reset Email
            </button>

        </form>


        <p class="back-login">

            <a href="/">
                Back to Login
            </a>

        </p>

    </div>


    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


    <script>

        const forgotPasswordForm =
            document.getElementById(
                "forgotPasswordForm"
            );


        forgotPasswordForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    document.getElementById("email").value;


                try {

                    const response =
                        await axios.post(
                            "/password/forgotpassword",
                            {
                                email: email
                            }
                        );


                    alert(
                        response.data.message
                    );


                } catch (error) {

                    alert(
                        error.response?.data?.message ||
                        "Something went wrong"
                    );
                }
            }
        );

    </script>

</body>

</html>
