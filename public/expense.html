<!DOCTYPE html>
<html>
<head>
    <title>Daily Expenses - Expense App</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .expense-form {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .expense-table {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dddddd;
        }

        th {
            background-color: #f2f2f2;
        }

        .delete-btn {
            margin-top: 0;
            width: auto;
            padding: 8px 12px;
            background-color: #dc3545;
            font-size: 14px;
        }

        .delete-btn:hover {
            background-color: #b02a37;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Daily Expenses</h1>

        <!-- ADD EXPENSE FORM -->
        <div class="expense-form">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <label for="amount">Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    required
                >

                <label for="category">Category</label>

                <select id="category" required>

                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Salary">Salary</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Travel">Travel</option>
                    <option value="Other">Other</option>

                </select>

                <label for="description">Description</label>

                <input
                    type="text"
                    id="description"
                    placeholder="Enter expense description"
                    required
                >

                <button type="submit">
                    Add Expense
                </button>

            </form>

        </div>


        <!-- EXPENSE TABLE -->
        <div class="expense-table">

            <h2>Your Expenses</h2>

            <table>

                <thead>
                    <tr>
                        <th>Amount</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="expenseList">
                </tbody>

            </table>

        </div>

    </div>


    <script>

        // Get JWT token saved during login
        const token = localStorage.getItem("token");


        // If token does not exist, go back to login
        if (!token) {

            window.location.href = "/login";
        }


        // Get expense form
        const expenseForm =
            document.getElementById("expenseForm");


        // Load expenses when page opens
        window.addEventListener("load", loadExpenses);


        // ==================== ADD EXPENSE ====================

        expenseForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const amount =
                    document.getElementById("amount").value;

                const description =
                    document.getElementById("description").value;

                const category =
                    document.getElementById("category").value;


                try {

                    const response =
                        await fetch("/api/expenses", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",

                                // Send JWT token
                                "Authorization":
                                    `Bearer ${token}`
                            },

                            body: JSON.stringify({
                                amount: amount,
                                description: description,
                                category: category
                            })
                        });


                    const data =
                        await response.json();


                    if (response.ok) {

                        alert(
                            "Expense added successfully"
                        );

                        // Clear form
                        expenseForm.reset();

                        // Reload expenses
                        loadExpenses();

                    } else {

                        alert(data.message);
                    }

                } catch (error) {

                    console.log(
                        "Error adding expense:",
                        error
                    );
                }
            }
        );


        // ==================== GET EXPENSES ====================

        async function loadExpenses() {

            try {

                const response =
                    await fetch("/api/expenses", {

                        headers: {

                            // Send JWT token
                            "Authorization":
                                `Bearer ${token}`
                        }
                    });


                // If token is invalid
                if (!response.ok) {

                    const data =
                        await response.json();

                    alert(data.message);

                    // Go to login page
                    localStorage.removeItem("token");

                    window.location.href =
                        "/login";

                    return;
                }


                const expenses =
                    await response.json();


                const expenseList =
                    document.getElementById(
                        "expenseList"
                    );


                // Clear existing rows
                expenseList.innerHTML = "";


                // Add every expense
                expenses.forEach((expense) => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `
                        <td>${expense.amount}</td>
                        <td>${expense.description}</td>
                        <td>${expense.category}</td>

                        <td>
                            <button
                                class="delete-btn"
                                onclick="deleteExpense(${expense.id})"
                            >
                                Delete
                            </button>
                        </td>
                    `;


                    expenseList.appendChild(row);

                });

            } catch (error) {

                console.log(
                    "Error fetching expenses:",
                    error
                );
            }
        }


        // ==================== DELETE EXPENSE ====================

        async function deleteExpense(expenseId) {

            try {

                const response =
                    await fetch(
                        `/api/expenses/${expenseId}`,
                        {

                            method: "DELETE",

                            headers: {

                                // Send JWT token
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    alert(
                        "Expense deleted successfully"
                    );

                    // Reload table
                    loadExpenses();

                } else {

                    alert(data.message);
                }

            } catch (error) {

                console.log(
                    "Error deleting expense:",
                    error
                );
            }
        }

    </script>

</body>
</html>
