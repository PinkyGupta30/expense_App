<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Daily Expenses</title>

    <link
      rel="stylesheet"
      href="/expense.css"
    />
  </head>

  <body>

    <div class="container">

      <!-- ==================== HEADER ==================== -->

      <h1>Daily Expenses</h1>


      <!-- ==================== PREMIUM SECTION ==================== -->

      <button
        id="premiumBtn"
        class="premium-btn"
      >
        Buy Premium Membership
      </button>


      <p
        id="premiumMessage"
        style="display: none"
      >
        You are a Premium User ⭐
      </p>


      <button
        id="leaderboardBtn"
        class="leaderboard-btn"
        style="display: none"
      >
        Show Leaderboard
      </button>


      <!-- ==================== ADD EXPENSE ==================== -->

      <div class="expense-form">

        <h2>Add Expense</h2>


        <form id="expenseForm">

          <label for="amount">
            Amount
          </label>

          <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            required
          />


          <label for="category">
            Category
          </label>

          <select
            id="category"
            required
          >

            <option value="">
              Select category
            </option>

            <option value="Food">
              Food
            </option>

            <option value="Travel">
              Travel
            </option>

            <option value="Shopping">
              Shopping
            </option>

            <option value="Salary">
              Salary
            </option>

            <option value="Bills">
              Bills
            </option>

            <option value="Entertainment">
              Entertainment
            </option>

            <option value="Other">
              Other
            </option>

          </select>


          <label for="description">
            Description
          </label>

          <input
            type="text"
            id="description"
            placeholder="Enter expense description"
            required
          />


          <!-- ==================== NOTE ==================== -->

          <label for="note">
            Note
          </label>

          <input
            type="text"
            id="note"
            placeholder="Enter a note (optional)"
          />


          <button type="submit">
            Add Expense
          </button>

        </form>

      </div>


      <!-- ==================== EXPENSE LIST ==================== -->

      <div class="expense-table">

        <h2>Your Expenses</h2>


        <!-- ==================== EXPENSES PER PAGE ==================== -->

        <label for="expensesPerPage">
          Expenses per page:
        </label>

        <select id="expensesPerPage">

          <option value="5">
            5
          </option>

          <option value="10">
            10
          </option>

          <option value="20">
            20
          </option>

          <option value="40">
            40
          </option>

        </select>


        <table>

          <thead>

            <tr>

              <th>Amount</th>

              <th>Description</th>

              <th>Category</th>

              <th>Note</th>

              <th>Action</th>

            </tr>

          </thead>


          <tbody
            id="expenseList"
          ></tbody>

        </table>


        <!-- ==================== PAGINATION ==================== -->

        <div
          id="pagination"
          class="pagination"
        ></div>

      </div>


      <!-- ==================== LEADERBOARD ==================== -->

      <div
        id="leaderboardContainer"
        class="expense-table"
        style="display: none"
      >

        <h2>Leaderboard</h2>


        <table>

          <thead>

            <tr>

              <th>Rank</th>

              <th>Name</th>

              <th>Total Expenses</th>

            </tr>

          </thead>


          <tbody
            id="leaderboardList"
          ></tbody>

        </table>

      </div>


      <!-- ==================== PREMIUM REPORT ==================== -->

      <div
        id="premiumReport"
        class="expense-table"
        style="display: none"
      >

        <h2>Expense Report</h2>


        <!-- ==================== REPORT BUTTONS ==================== -->

        <div class="report-buttons">

          <button
            type="button"
            class="report-btn active-report-btn"
            data-period="daily"
          >
            Daily
          </button>


          <button
            type="button"
            class="report-btn"
            data-period="weekly"
          >
            Weekly
          </button>


          <button
            type="button"
            class="report-btn"
            data-period="monthly"
          >
            Monthly
          </button>

        </div>


        <!-- ==================== SUMMARY CARDS ==================== -->

        <div class="report-summary">

          <div class="summary-card">

            <h3>Total Income</h3>

            <p id="totalIncome">
              ₹0
            </p>

          </div>


          <div class="summary-card">

            <h3>Total Expense</h3>

            <p id="totalExpense">
              ₹0
            </p>

          </div>


          <div class="summary-card">

            <h3>Savings</h3>

            <p id="totalSavings">
              ₹0
            </p>

          </div>

        </div>


        <!-- ==================== REPORT TABLE ==================== -->

        <table>

          <thead>

            <tr>

              <th>Period</th>

              <th>Income</th>

              <th>Expense</th>

              <th>Savings</th>

            </tr>

          </thead>


          <tbody
            id="reportList"
          ></tbody>

        </table>


        <!-- ==================== DOWNLOAD BUTTON ==================== -->

        <button
          id="downloadBtn"
          class="download-btn"
          disabled
        >
          Download Expenses
        </button>

      </div>

    </div>


    <!-- ==================== CASHFREE ==================== -->

    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>


    <!-- ==================== JAVASCRIPT FILES ==================== -->

    <script src="/js/expense.js"></script>

    <script src="/js/premium.js"></script>

    <script src="/js/report.js"></script>

  </body>

</html>
