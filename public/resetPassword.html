<!DOCTYPE html>
<html>

<head>
    <title>Reset Password - Expense App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            width: 400px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000026;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cccccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Reset Password</h1>

        <form id="resetPasswordForm">

            <label for="password">
                New Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                required
            >

            <button type="submit">
                Update Password
            </button>

        </form>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>

        const resetPasswordForm =
            document.getElementById("resetPasswordForm");


        // Get UUID from current URL
        const urlParts =
            window.location.pathname.split("/");

        const id =
            urlParts[urlParts.length - 1];


        resetPasswordForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();

                const password =
                    document.getElementById("password").value;

                try {

                    const response =
                        await axios.post(
                            `/api/user/updatepassword/${id}`,
                            {
                                password: password
                            }
                        );

                    alert(response.data.message);

                    window.location.href = "/login";

                } catch (error) {

                    alert(
                        error.response?.data?.message ||
                        "Something went wrong"
                    );
                }
            }
        );

    </script>

</body>
</html>
